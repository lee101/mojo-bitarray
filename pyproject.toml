[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-bitarray"
version = "0.1.0"
description = "Packed bit vectors and bitwise operations accelerated by Mojo"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
